[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

# Single-page app: serve index.html for all routes
# (Hash routing handles navigation client-side, but this ensures
# direct URL access and refreshes always work correctly.)
# Clean URL for the news-fetch function
[[redirects]]
  from   = "/api/news"
  to     = "/.netlify/functions/fetch-news"
  status = 200

# Single-page app catch-all (must be last)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
